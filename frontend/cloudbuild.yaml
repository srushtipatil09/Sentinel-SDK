# Cloud Build — build, push, and deploy Sentinel AI Frontend to Cloud Run

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: sentinelai-frontend

steps:
  # 1. Build container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "."

  # 2. Push to Container Registry / Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"

images:
  - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
